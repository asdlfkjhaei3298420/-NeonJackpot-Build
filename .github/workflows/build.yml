          struct RollingReelView: View {
              let finalSymbol: SlotSymbol
              let spinning: Bool
              let reelIndex: Int

              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 15)
                          .fill(
                              LinearGradient(
                                  colors: [
                                      .white.opacity(0.98),
                                      .white.opacity(0.75)
                                  ],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          )

                      if spinning {
                          TimelineView(.animation) { context in
                              let time = context.date.timeIntervalSinceReferenceDate
                              let speed = 9.5 + Double(reelIndex) * 2.1
                              let rawPosition = time * speed
                              let baseIndex = Int(floor(rawPosition))
                              let fraction = rawPosition - floor(rawPosition)
                              let symbols = SlotSymbol.allCases
                              let current = symbols[
                                  positiveModulo(baseIndex + reelIndex, symbols.count)
                              ]
                              let next = symbols[
                                  positiveModulo(baseIndex + reelIndex + 1, symbols.count)
                              ]

                              VStack(spacing: 0) {
                                  SlotSymbolView(symbol: current)
                                  SlotSymbolView(symbol: next)
                              }
                              .offset(y: CGFloat(-fraction * 88))
                              .blur(radius: 1.1)
                          }
                      } else {
                          SlotSymbolView(symbol: finalSymbol)
                              .transition(.scale.combined(with: .opacity))
                      }
                  }
                  .frame(maxWidth: .infinity)
                  .frame(height: 106)
                  .clipped()
                  .overlay {
                      RoundedRectangle(cornerRadius: 15)
                          .stroke(.cyan.opacity(0.65), lineWidth: 2)
                  }
                  .animation(.spring(response: 0.28), value: spinning)
              }

              private func positiveModulo(_ value: Int, _ modulus: Int) -> Int {
                  let result = value % modulus
                  return result >= 0 ? result : result + modulus
              }
          }

          struct SlotSymbolView: View {
              let symbol: SlotSymbol

              var body: some View {
                  Group {
                      if symbol == .seven {
