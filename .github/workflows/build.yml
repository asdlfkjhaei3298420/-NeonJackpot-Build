              }

              private func statusRow(
                  _ title: String,
                  _ value: String
              ) -> some View {
                  HStack {
                      Text(title)
                          .foregroundStyle(.white.opacity(0.65))

                      Spacer()

                      Text(value)
                          .font(.headline.monospaced().bold())
                  }
              }
          }
          SWIFT

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          brew untap aws/tap || true
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build unsigned physical-device app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project NeonJackpot.xcodeproj \
            -scheme NeonJackpot \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="DerivedData/Build/Products/Release-iphoneos/NeonJackpot.app"

          test -d "$APP_PATH"

          rm -rf Payload
          rm -f NeonJackpot-LiveContainer.ipa

          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip \
            -qry \
            NeonJackpot-LiveContainer.ipa \
            Payload

          /usr/bin/unzip \
            -t \
            NeonJackpot-LiveContainer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeonJackpot-LiveContainer
          path: NeonJackpot-LiveContainer.ipa
          if-no-files-found: error
          retention-days: 7
