              private var rouletteBoard: some View {
                  GeometryReader { geometry in
                      let width = geometry.size.width
                      let height = geometry.size.height
                      let outsideHeight: CGFloat = 62
                      let zeroHeight: CGFloat = 32
                      let boardHeight = height - outsideHeight - zeroHeight
                      let cellWidth = width / 3
                      let cellHeight = boardHeight / 12

                      ZStack(alignment: .topLeading) {
                          Color(red: 0.02, green: 0.29, blue: 0.16)

                          rouletteCell(
                              number: 0,
                              spot: .straight(0)
                          )
                          .frame(width: width, height: zeroHeight)
                          .position(x: width / 2, y: zeroHeight / 2)

                          ForEach(0..<12, id: \.self) { row in
                              ForEach(0..<3, id: \.self) { column in
                                  let number = row * 3 + column + 1

                                  rouletteCell(
                                      number: number,
                                      spot: .straight(number)
                                  )
                                  .frame(
                                      width: cellWidth,
                                      height: cellHeight
                                  )
                                  .position(
                                      x: cellWidth * (CGFloat(column) + 0.5),
                                      y: zeroHeight + cellHeight * (CGFloat(row) + 0.5)
                                  )
                              }
                          }

                          ForEach(0..<12, id: \.self) { row in
                              ForEach(0..<2, id: \.self) { boundary in
                                  let left = row * 3 + boundary + 1
                                  let right = left + 1
                                  let spot = RouletteBetSpot.split(left, right)

                                  rouletteDropNode(spot)
                                      .position(
                                          x: cellWidth * CGFloat(boundary + 1),
                                          y: zeroHeight + cellHeight * (CGFloat(row) + 0.5)
                                      )
                              }
                          }

                          ForEach(0..<11, id: \.self) { row in
                              ForEach(0..<3, id: \.self) { column in
                                  let top = row * 3 + column + 1
                                  let bottom = top + 3
                                  let spot = RouletteBetSpot.split(top, bottom)

                                  rouletteDropNode(spot)
                                      .position(
                                          x: cellWidth * (CGFloat(column) + 0.5),
                                          y: zeroHeight + cellHeight * CGFloat(row + 1)
                                      )
                              }
                          }

                          ForEach(0..<11, id: \.self) { row in
                              ForEach(0..<2, id: \.self) { boundary in
                                  let topLeft = row * 3 + boundary + 1
                                  let values = [
                                      topLeft,
                                      topLeft + 1,
                                      topLeft + 3,
                                      topLeft + 4
                                  ]
                                  let spot = RouletteBetSpot.corner(values)

                                  rouletteDropNode(spot, compact: true)
                                      .position(
                                          x: cellWidth * CGFloat(boundary + 1),
                                          y: zeroHeight + cellHeight * CGFloat(row + 1)
                                      )
                              }
                          }

                          outsideBetRow(
                              width: width,
                              y: zeroHeight + boardHeight,
                              height: outsideHeight
                          )
                      }
                      .clipShape(RoundedRectangle(cornerRadius: 14))
                      .overlay {
                          RoundedRectangle(cornerRadius: 14)
                              .stroke(.white.opacity(0.35), lineWidth: 1)
                      }
                  }
                  .frame(maxHeight: .infinity)
              }

