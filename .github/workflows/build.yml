          struct SlotMachineGrid: View {
              let grid: [[SlotSymbol]]
              let spinning: Bool
              let winningLines: [Int]

              var body: some View {
                  GeometryReader { geometry in
                      let cellWidth = geometry.size.width / 5
                      let cellHeight = geometry.size.height / 3

                      ZStack {
                          HStack(spacing: 0) {
                              ForEach(0..<5, id: \.self) { column in
                                  SlotReelColumn(
                                      finalSymbols: [
                                          grid[0][column],
                                          grid[1][column],
                                          grid[2][column]
                                      ],
                                      spinning: spinning,
                                      reelIndex: column
                                  )
                                  .frame(width: cellWidth)
                              }
                          }

                          if !spinning && !winningLines.isEmpty {
                              TimelineView(.animation) { context in
                                  let phase = Int(
                                      context.date.timeIntervalSinceReferenceDate * 3
                                  ) % 2
                                  let visible = phase == 0

                                  Canvas { canvas, size in
                                      guard visible else { return }

                                      for lineID in winningLines {
                                          guard let line = SlotPayline.all.first(
                                              where: { $0.id == lineID }
                                          ) else {
                                              continue
                                          }

                                          var path = Path()

                                          for column in 0..<5 {
                                              let point = CGPoint(
                                                  x: cellWidth * (CGFloat(column) + 0.5),
                                                  y: cellHeight * (
                                                      CGFloat(line.rows[column]) + 0.5
                                                  )
                                              )

                                              if column == 0 {
                                                  path.move(to: point)
                                              } else {
                                                  path.addLine(to: point)
                                              }
                                          }

                                          canvas.stroke(
                                              path,
                                              with: .color(.yellow),
                                              style: StrokeStyle(
                                                  lineWidth: 5,
                                                  lineCap: .round,
                                                  lineJoin: .round
                                              )
                                          )
                                      }
                                  }
                              }
                              .allowsHitTesting(false)
                          }
                      }
                      .background(.black.opacity(0.65))
                      .clipShape(RoundedRectangle(cornerRadius: 18))
                      .overlay {
                          RoundedRectangle(cornerRadius: 18)
                              .stroke(
                                  LinearGradient(
                                      colors: [.cyan, .purple, .pink],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  ),
                                  lineWidth: 3
                              )
                      }
                  }
              }
          }

          struct SlotReelColumn: View {
              let finalSymbols: [SlotSymbol]
              let spinning: Bool
              let reelIndex: Int

              var body: some View {
                  GeometryReader { geometry in
                      let cellHeight = geometry.size.height / 3

                      ZStack {
                          Color.white.opacity(0.92)

                          if spinning {
                              TimelineView(.animation) { context in
                                  let time = context.date.timeIntervalSinceReferenceDate
                                  let speed = 10.0 + Double(reelIndex) * 1.7
                                  let raw = time * speed
                                  let base = Int(floor(raw))
                                  let fraction = raw - floor(raw)
                                  let symbols = SlotSymbol.allCases

                                  VStack(spacing: 0) {
                                      ForEach(0..<5, id: \.self) { row in
                                          let index = positiveModulo(
                                              base + row + reelIndex,
                                              symbols.count
                                          )

                                          CompactSlotSymbolView(symbol: symbols[index])
                                              .frame(height: cellHeight)
                                      }
                                  }
                                  .offset(y: -cellHeight * CGFloat(fraction + 1))
                                  .blur(radius: 0.9)
                              }
                          } else {
                              VStack(spacing: 0) {
                                  ForEach(0..<3, id: \.self) { row in
                                      CompactSlotSymbolView(symbol: finalSymbols[row])
                                          .frame(height: cellHeight)
                                  }
                              }
                          }

                          VStack(spacing: 0) {
                              ForEach(0..<3, id: \.self) { _ in
                                  Rectangle()
                                      .stroke(.black.opacity(0.22), lineWidth: 0.6)
                              }
                          }
                      }
                      .clipped()
                      .overlay(alignment: .trailing) {
                          Rectangle()
                              .fill(.black.opacity(0.25))
                              .frame(width: 1)
                      }
                  }
              }

              private func positiveModulo(_ value: Int, _ modulus: Int) -> Int {
                  let result = value % modulus
                  return result >= 0 ? result : result + modulus
              }
          }

