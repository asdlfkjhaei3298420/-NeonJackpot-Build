name: Build Neon Jackpot IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Create iOS project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p NeonJackpot

          cat > project.yml <<'PROJECT'
          name: NeonJackpot

          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "17.0"

          targets:
            NeonJackpot:
              type: application
              platform: iOS
              sources:
                - NeonJackpot
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.NeonJackpot
                  PRODUCT_NAME: NeonJackpot
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: NeonJackpot/Info.plist
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          PROJECT

          cat > NeonJackpot/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>

              <key>CFBundleDisplayName</key>
              <string>Neon Jackpot</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>

              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>

              <key>UILaunchScreen</key>
              <dict/>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>

              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
              </array>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>ITSAppUsesNonExemptEncryption</key>
              <false/>
          </dict>
          </plist>
          PLIST

          cat > NeonJackpot/NeonJackpotApp.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import AudioToolbox

          @main
          struct NeonJackpotApp: App {
              @StateObject private var game = CasinoModel()

              var body: some Scene {
                  WindowGroup {
                      CasinoHomeView()
                          .environmentObject(game)
                          .preferredColorScheme(.dark)
                  }
              }
          }

          enum CasinoGame: String, CaseIterable, Identifiable {
              case slots = "Slots"
              case roulette = "Roulette"
              case blackjack = "Blackjack"

              var id: String { rawValue }

              var icon: String {
                  switch self {
                  case .slots: return "rectangle.split.3x1.fill"
                  case .roulette: return "circle.grid.3x3.fill"
                  case .blackjack: return "suit.spade.fill"
                  }
              }
          }

          enum SlotSymbol: String, CaseIterable, Codable {
              case seven
              case diamond
              case bell
              case cherry
              case star
              case bolt

              var display: String {
                  switch self {
                  case .seven: return "7"
                  case .diamond: return "diamond.fill"
                  case .bell: return "bell.fill"
                  case .cherry: return "circle.grid.cross.fill"
                  case .star: return "star.fill"
                  case .bolt: return "bolt.fill"
                  }
              }

              var multiplier: Int {
                  switch self {
                  case .seven: return 25
                  case .diamond: return 15
                  case .bell: return 10
                  case .cherry: return 8
                  case .star: return 6
                  case .bolt: return 4
                  }
              }

              var weight: Int {
                  switch self {
                  case .seven: return 3
                  case .diamond: return 5
                  case .bell: return 8
                  case .cherry: return 12
                  case .star: return 18
                  case .bolt: return 24
                  }
              }
          }


          struct SlotPayline {
              let id: Int
              let rows: [Int]

              static let all: [SlotPayline] = [
                  SlotPayline(id: 0, rows: [0, 0, 0, 0, 0]),
                  SlotPayline(id: 1, rows: [1, 1, 1, 1, 1]),
                  SlotPayline(id: 2, rows: [2, 2, 2, 2, 2]),
                  SlotPayline(id: 3, rows: [0, 1, 2, 1, 0]),
                  SlotPayline(id: 4, rows: [2, 1, 0, 1, 2]),
                  SlotPayline(id: 5, rows: [0, 0, 1, 2, 2]),
                  SlotPayline(id: 6, rows: [2, 2, 1, 0, 0]),
                  SlotPayline(id: 7, rows: [1, 0, 0, 0, 1]),
                  SlotPayline(id: 8, rows: [1, 2, 2, 2, 1])
              ]
          }

          enum BlackjackPhase {
              case ready
              case playerTurn
              case dealerTurn
              case finished
          }

          enum Suit: String, CaseIterable {
              case hearts = "heart.fill"
              case diamonds = "diamond.fill"
              case clubs = "suit.club.fill"
              case spades = "suit.spade.fill"

              var isRed: Bool {
                  self == .hearts || self == .diamonds
              }
          }

          enum Rank: String, CaseIterable {
              case ace = "A"
              case two = "2"
              case three = "3"
              case four = "4"
              case five = "5"
              case six = "6"
              case seven = "7"
              case eight = "8"
              case nine = "9"
              case ten = "10"
              case jack = "J"
              case queen = "Q"
              case king = "K"

              var blackjackValue: Int {
                  switch self {
                  case .ace: return 11
                  case .jack, .queen, .king: return 10
                  default: return Int(rawValue) ?? 0
                  }
              }
          }

          struct PlayingCard: Identifiable, Equatable {
              let id = UUID()
              let suit: Suit
              let rank: Rank
          }

          struct RouletteBetSpot: Hashable {
              let id: String
              let numbers: [Int]
              let payoutOdds: Int
              let label: String

              static func straight(_ number: Int) -> RouletteBetSpot {
                  RouletteBetSpot(
                      id: "N:\(number)",
                      numbers: [number],
                      payoutOdds: 35,
                      label: "\(number)"
                  )
              }

              static func split(_ first: Int, _ second: Int) -> RouletteBetSpot {
                  let values = [first, second].sorted()
                  return RouletteBetSpot(
                      id: "S:\(values[0])-\(values[1])",
                      numbers: values,
                      payoutOdds: 17,
                      label: "\(values[0])/\(values[1])"
                  )
              }

              static func corner(_ numbers: [Int]) -> RouletteBetSpot {
                  let values = numbers.sorted()
                  return RouletteBetSpot(
                      id: "C:" + values.map(String.init).joined(separator: "-"),
                      numbers: values,
                      payoutOdds: 8,
                      label: values.map(String.init).joined(separator: "/")
                  )
              }

              static func outside(
                  id: String,
                  label: String,
                  numbers: [Int],
                  odds: Int = 1
              ) -> RouletteBetSpot {
                  RouletteBetSpot(
                      id: "O:\(id)",
                      numbers: numbers,
                      payoutOdds: odds,
                      label: label
                  )
              }
          }

          enum CasinoSound {
              static func tap() {
                  AudioServicesPlaySystemSound(1104)
              }

              static func chip() {
                  AudioServicesPlaySystemSound(1105)
              }

              static func spin() {
                  AudioServicesPlaySystemSound(1117)
              }

              static func card() {
                  AudioServicesPlaySystemSound(1103)
              }

              static func win() {
                  AudioServicesPlaySystemSound(1025)
              }

              static func lose() {
                  AudioServicesPlaySystemSound(1053)
              }
          }

          @MainActor
          final class CasinoModel: ObservableObject {
              @Published var balance: Int {
                  didSet {
                      UserDefaults.standard.set(balance, forKey: "balance")
                  }
              }

              @Published var wager: Int {
                  didSet {
                      UserDefaults.standard.set(wager, forKey: "wager")
                  }
              }

              @Published var developerMode: Bool {
                  didSet {
                      UserDefaults.standard.set(developerMode, forKey: "developerMode")
                  }
              }

              @Published var selectedGame: CasinoGame = .slots

              @Published var slotGrid: [[SlotSymbol]] = [
                  [.seven, .diamond, .bell, .star, .bolt],
                  [.cherry, .seven, .diamond, .bell, .star],
                  [.bolt, .cherry, .seven, .diamond, .bell]
              ]
              @Published var slotWinningLines: [Int] = []
              @Published var slotIsSpinning = false
              @Published var slotStopRequested = false
              @Published var slotLastWin = 0
              @Published var slotMessage = "READY TO PLAY - 9 LINES"
              @Published var slotTotalSpins: Int {
                  didSet {
                      UserDefaults.standard.set(slotTotalSpins, forKey: "slotTotalSpins")
                  }
              }
              @Published var slotBiggestWin: Int {
                  didSet {
                      UserDefaults.standard.set(slotBiggestWin, forKey: "slotBiggestWin")
                  }
              }

              @Published var rouletteBets: [String: Int] = [:]
              @Published var rouletteSpots: [String: RouletteBetSpot] = [:]
              @Published var roulettePreviousBets: [String: Int] = [:]
              @Published var roulettePreviousSpots: [String: RouletteBetSpot] = [:]
              @Published var rouletteSelectedChip = 25
              @Published var rouletteWinningNumber: Int?
              @Published var rouletteIsSpinning = false
              @Published var rouletteMessage = "DRAG CHIPS ONTO THE TABLE"
              @Published var rouletteLastWin = 0

              @Published var blackjackPlayerCards: [PlayingCard] = []
              @Published var blackjackDealerCards: [PlayingCard] = []
              @Published var blackjackPhase: BlackjackPhase = .ready
              @Published var blackjackMessage = "DEAL A HAND"
              @Published var blackjackLastWin = 0

              let availableWagers = [
                  5, 10, 25, 50, 100,
                  250, 500, 1_000, 2_500, 5_000,
                  10_000, 25_000, 50_000, 100_000
              ]

              let rouletteChipValues = [
                  5, 25, 100, 500, 1_000, 5_000,
                  10_000, 25_000, 50_000, 100_000
              ]

              private var blackjackDeck: [PlayingCard] = []

              var canStartWager: Bool {
                  developerMode || balance >= wager
              }

              var totalRouletteStake: Int {
                  rouletteBets.values.reduce(0, +)
              }

              var canSpinRoulette: Bool {
                  !rouletteIsSpinning &&
                  totalRouletteStake > 0 &&
                  (developerMode || totalRouletteStake <= balance)
              }

              var playerBlackjackScore: Int {
                  blackjackScore(blackjackPlayerCards)
              }

              var dealerBlackjackScore: Int {
                  blackjackScore(blackjackDealerCards)
              }

              init() {
                  let defaults = UserDefaults.standard

                  balance = defaults.object(forKey: "balance") == nil
                      ? 1_000
                      : defaults.integer(forKey: "balance")

                  wager = defaults.object(forKey: "wager") == nil
                      ? 10
                      : defaults.integer(forKey: "wager")

                  developerMode = defaults.bool(forKey: "developerMode")
                  slotTotalSpins = defaults.integer(forKey: "slotTotalSpins")
                  slotBiggestWin = defaults.integer(forKey: "slotBiggestWin")
              }

              func primarySlotButtonPressed() {
                  CasinoSound.tap()

                  if slotIsSpinning {
                      slotStopRequested = true
                      slotMessage = "FAST STOP..."
                  } else {
                      Task {
                          await spinSlots()
                      }
                  }
              }

              func spinSlots() async {
                  guard !slotIsSpinning else { return }

                  guard canStartWager else {
                      slotMessage = "NOT ENOUGH CREDITS"
                      CasinoSound.lose()
                      return
                  }

                  slotIsSpinning = true
                  slotStopRequested = false
                  slotLastWin = 0
                  slotWinningLines = []
                  slotMessage = "SPINNING - TAP AGAIN TO STOP"
                  chargeWager(wager)
                  CasinoSound.spin()

                  for frame in 0..<34 {
                      if slotStopRequested && frame >= 5 {
                          break
                      }

                      let delay = UInt64(55_000_000 + min(frame, 20) * 2_000_000)
                      try? await Task.sleep(nanoseconds: delay)
                  }

                  slotGrid = (0..<3).map { _ in
                      (0..<5).map { _ in randomSlotSymbol() }
                  }

                  slotTotalSpins += 1
                  let result = evaluateSlotLines()
                  slotWinningLines = result.lines
                  let payout = result.payout
                  slotLastWin = payout

                  if payout > 0 {
                      balance += payout
                      slotBiggestWin = max(slotBiggestWin, payout)
                      CasinoSound.win()

                      let sevenLine = slotWinningLines.contains { lineID in
                          guard let line = SlotPayline.all.first(where: { $0.id == lineID }) else {
                              return false
                          }

                          return (0..<5).allSatisfy {
                              slotGrid[line.rows[$0]][$0] == .seven
                          }
                      }

                      slotMessage = sevenLine
                          ? "MEGA JACKPOT!"
                          : "\(slotWinningLines.count) LINE WIN +$\(payout.formatted())"
                  } else {
                      CasinoSound.lose()
                      slotMessage = developerMode
                          ? "NO WIN - DEV MODE PROTECTED"
                          : "TRY AGAIN"
                  }

                  slotStopRequested = false
                  slotIsSpinning = false
              }

              func addRouletteBet(_ spot: RouletteBetSpot, chip: Int) {
                  guard !rouletteIsSpinning else { return }

                  let newTotal = totalRouletteStake + chip

                  guard developerMode || newTotal <= balance else {
                      rouletteMessage = "NOT ENOUGH CREDITS FOR THAT CHIP"
                      CasinoSound.lose()
                      return
                  }

                  rouletteSpots[spot.id] = spot
                  rouletteBets[spot.id, default: 0] += chip
                  rouletteMessage = "\(spot.label) +$\(chip.formatted())"
                  CasinoSound.chip()
              }

              func clearRouletteBets() {
                  guard !rouletteIsSpinning else { return }
                  rouletteBets.removeAll()
                  rouletteSpots.removeAll()
                  roulettePreviousBets.removeAll()
                  roulettePreviousSpots.removeAll()
                  rouletteWinningNumber = nil
                  rouletteMessage = "TABLE CLEARED"
                  CasinoSound.tap()
              }

              func placePreviousRouletteBet() {
                  guard !rouletteIsSpinning else { return }
                  guard !roulettePreviousBets.isEmpty else {
                      rouletteMessage = "NO PREVIOUS BET"
                      CasinoSound.lose()
                      return
                  }

                  let previousTotal = roulettePreviousBets.values.reduce(0, +)

                  guard developerMode || previousTotal <= balance else {
                      rouletteMessage = "NOT ENOUGH CREDITS TO REBET"
                      CasinoSound.lose()
                      return
                  }

                  rouletteBets = roulettePreviousBets
                  rouletteSpots = roulettePreviousSpots
                  rouletteWinningNumber = nil
                  rouletteMessage = "PREVIOUS BET RESTORED"
                  CasinoSound.chip()
              }

              func removeLastRouletteChip() {
                  guard !rouletteIsSpinning else { return }
                  guard let key = rouletteBets.keys.sorted().last else { return }

                  let current = rouletteBets[key] ?? 0
                  let removal = rouletteChipValues
                      .filter { $0 <= current }
                      .max() ?? current

                  let updated = current - removal

                  if updated <= 0 {
                      rouletteBets.removeValue(forKey: key)
                      rouletteSpots.removeValue(forKey: key)
                  } else {
                      rouletteBets[key] = updated
                  }

                  rouletteMessage = "REMOVED $\(removal.formatted())"
                  CasinoSound.tap()
              }

              func spinRoulette(winningNumber: Int) async {
                  guard canSpinRoulette else {
                      rouletteMessage = totalRouletteStake == 0
                          ? "PLACE AT LEAST ONE CHIP"
                          : "NOT ENOUGH CREDITS"
                      CasinoSound.lose()
                      return
                  }

                  rouletteIsSpinning = true
                  rouletteWinningNumber = nil
                  rouletteLastWin = 0
                  roulettePreviousBets = rouletteBets
                  roulettePreviousSpots = rouletteSpots
                  rouletteMessage = "NO MORE BETS"
                  chargeWager(totalRouletteStake)
                  CasinoSound.spin()

                  try? await Task.sleep(nanoseconds: 3_250_000_000)

                  rouletteWinningNumber = winningNumber

                  var returnAmount = 0

                  for (key, amount) in rouletteBets {
                      guard
                          let spot = rouletteSpots[key],
                          spot.numbers.contains(winningNumber)
                      else {
                          continue
                      }

                      returnAmount += amount * (spot.payoutOdds + 1)
                  }

                  rouletteLastWin = returnAmount

                  if returnAmount > 0 {
                      balance += returnAmount
                      rouletteMessage = "\(rouletteLabel(for: winningNumber)) - WIN +$\(returnAmount.formatted())"
                      CasinoSound.win()
                  } else {
                      rouletteMessage = developerMode
                          ? "\(rouletteLabel(for: winningNumber)) - DEV MODE PROTECTED"
                          : "\(rouletteLabel(for: winningNumber)) - NO WIN"
                      CasinoSound.lose()
                  }

                  rouletteBets.removeAll()
                  rouletteSpots.removeAll()
                  rouletteIsSpinning = false
              }

              func dealBlackjack() {
                  guard blackjackPhase == .ready || blackjackPhase == .finished else { return }

                  guard canStartWager else {
                      blackjackMessage = "NOT ENOUGH CREDITS"
                      CasinoSound.lose()
                      return
                  }

                  chargeWager(wager)
                  blackjackLastWin = 0
                  blackjackDeck = makeDeck()
                  blackjackPlayerCards = [drawCard(), drawCard()]
                  blackjackDealerCards = [drawCard(), drawCard()]
                  blackjackPhase = .playerTurn
                  blackjackMessage = "HIT OR STAND"
                  CasinoSound.card()

                  if playerBlackjackScore == 21 {
                      resolveImmediateBlackjack()
                  }
              }

              func blackjackHit() {
                  guard blackjackPhase == .playerTurn else { return }

                  blackjackPlayerCards.append(drawCard())
                  CasinoSound.card()

                  if playerBlackjackScore > 21 {
                      blackjackMessage = developerMode
                          ? "BUST - DEV MODE PROTECTED"
                          : "BUST - DEALER WINS"
                      blackjackPhase = .finished
                      CasinoSound.lose()
                  } else if playerBlackjackScore == 21 {
                      blackjackStand()
                  }
              }

              func blackjackStand() {
                  guard blackjackPhase == .playerTurn else { return }

                  blackjackPhase = .dealerTurn

                  while dealerBlackjackScore < 17 {
                      blackjackDealerCards.append(drawCard())
                      CasinoSound.card()
                  }

                  resolveBlackjack()
              }

              func resetBalance() {
                  balance = 1_000
                  slotLastWin = 0
                  rouletteLastWin = 0
                  blackjackLastWin = 0
                  slotMessage = "BALANCE RESET TO $1,000"
                  rouletteMessage = "BALANCE RESET TO $1,000"
                  blackjackMessage = "BALANCE RESET TO $1,000"
              }

              func resetEverything() {
                  balance = 1_000
                  wager = 10
                  developerMode = false

                  slotGrid = [
                      [.seven, .diamond, .bell, .star, .bolt],
                      [.cherry, .seven, .diamond, .bell, .star],
                      [.bolt, .cherry, .seven, .diamond, .bell]
                  ]
                  slotWinningLines = []
                  slotIsSpinning = false
                  slotStopRequested = false
                  slotLastWin = 0
                  slotTotalSpins = 0
                  slotBiggestWin = 0
                  slotMessage = "GAME DATA RESET"

                  rouletteBets.removeAll()
                  rouletteSpots.removeAll()
                  rouletteWinningNumber = nil
                  rouletteIsSpinning = false
                  rouletteLastWin = 0
                  rouletteSelectedChip = 25
                  rouletteMessage = "GAME DATA RESET"

                  blackjackPlayerCards = []
                  blackjackDealerCards = []
                  blackjackPhase = .ready
                  blackjackLastWin = 0
                  blackjackMessage = "GAME DATA RESET"
              }

              func isRouletteRed(_ number: Int) -> Bool {
                  EuropeanRoulette.redNumbers.contains(number)
              }

              func rouletteLabel(for number: Int) -> String {
                  if number == 0 {
                      return "0 GREEN"
                  }

                  return "\(number) \(isRouletteRed(number) ? "RED" : "BLACK")"
              }

              private func chargeWager(_ amount: Int) {
                  if !developerMode {
                      balance -= amount
                  }
              }

              private func evaluateSlotLines() -> (payout: Int, lines: [Int]) {
                  var payout = 0
                  var winningLines: [Int] = []

                  for line in SlotPayline.all {
                      let symbols = (0..<5).map {
                          slotGrid[line.rows[$0]][$0]
                      }

                      let first = symbols[0]
                      var matchingCount = 1

                      for symbol in symbols.dropFirst() {
                          if symbol == first {
                              matchingCount += 1
                          } else {
                              break
                          }
                      }

                      guard matchingCount >= 3 else { continue }

                      let lineMultiplier: Int
                      switch matchingCount {
                      case 5:
                          lineMultiplier = first.multiplier * 5
                      case 4:
                          lineMultiplier = first.multiplier * 2
                      default:
                          lineMultiplier = first.multiplier
                      }

                      payout += wager * lineMultiplier
                      winningLines.append(line.id)
                  }

                  return (payout, winningLines)
              }

              private func randomSlotSymbol() -> SlotSymbol {
                  let totalWeight = SlotSymbol.allCases.reduce(0) {
                      $0 + $1.weight
                  }

                  var roll = Int.random(in: 1...totalWeight)

                  for symbol in SlotSymbol.allCases {
                      roll -= symbol.weight

                      if roll <= 0 {
                          return symbol
                      }
                  }

                  return .bolt
              }

              private func makeDeck() -> [PlayingCard] {
                  var deck: [PlayingCard] = []

                  for suit in Suit.allCases {
                      for rank in Rank.allCases {
                          deck.append(PlayingCard(suit: suit, rank: rank))
                      }
                  }

                  return deck.shuffled()
              }

              private func drawCard() -> PlayingCard {
                  if blackjackDeck.isEmpty {
                      blackjackDeck = makeDeck()
                  }

                  return blackjackDeck.removeLast()
              }

              private func blackjackScore(_ cards: [PlayingCard]) -> Int {
                  var total = cards.reduce(0) {
                      $0 + $1.rank.blackjackValue
                  }

                  var aces = cards.filter {
                      $0.rank == .ace
                  }.count

                  while total > 21 && aces > 0 {
                      total -= 10
                      aces -= 1
                  }

                  return total
              }

              private func resolveImmediateBlackjack() {
                  if dealerBlackjackScore == 21 {
                      if !developerMode {
                          balance += wager
                      }

                      blackjackLastWin = wager
                      blackjackMessage = "PUSH - BOTH HAVE BLACKJACK"
                  } else {
                      let returnAmount = developerMode
                          ? wager * 3 / 2
                          : wager * 5 / 2

                      balance += returnAmount
                      blackjackLastWin = returnAmount
                      blackjackMessage = "BLACKJACK! +$\(returnAmount.formatted())"
                      CasinoSound.win()
                  }

                  blackjackPhase = .finished
              }

              private func resolveBlackjack() {
                  let player = playerBlackjackScore
                  let dealer = dealerBlackjackScore

                  if dealer > 21 || player > dealer {
                      let returnAmount = developerMode ? wager : wager * 2
                      balance += returnAmount
                      blackjackLastWin = returnAmount
                      blackjackMessage = dealer > 21
                          ? "DEALER BUSTS - YOU WIN"
                          : "YOU WIN"
                      CasinoSound.win()
                  } else if player == dealer {
                      if !developerMode {
                          balance += wager
                      }

                      blackjackLastWin = developerMode ? 0 : wager
                      blackjackMessage = "PUSH"
                      CasinoSound.tap()
                  } else {
                      blackjackMessage = developerMode
                          ? "DEALER WINS - DEV MODE PROTECTED"
                          : "DEALER WINS"
                      CasinoSound.lose()
                  }

                  blackjackPhase = .finished
              }
          }

          enum EuropeanRoulette {
              static let order = [
                  0, 32, 15, 19, 4, 21, 2, 25, 17, 34,
                  6, 27, 13, 36, 11, 30, 8, 23, 10, 5,
                  24, 16, 33, 1, 20, 14, 31, 9, 22, 18,
                  29, 7, 28, 12, 35, 3, 26
              ]

              static let redNumbers: Set<Int> = [
                  1, 3, 5, 7, 9, 12, 14, 16, 18,
                  19, 21, 23, 25, 27, 30, 32, 34, 36
              ]
          }

          struct CasinoHomeView: View {
              @EnvironmentObject private var game: CasinoModel

              @State private var titleTapCount = 0
              @State private var showingAdmin = false

              var body: some View {
                  ZStack {
                      CasinoBackground()
                          .ignoresSafeArea()

                      VStack(spacing: 7) {
                          compactHeader
                          compactStatus
                          gameSelector

                          TabView(selection: $game.selectedGame) {
                              SlotsView()
                                  .tag(CasinoGame.slots)

                              RouletteView()
                                  .tag(CasinoGame.roulette)

                              BlackjackView()
                                  .tag(CasinoGame.blackjack)
                          }
                          .tabViewStyle(.page(indexDisplayMode: .never))
                      }
                      .padding(.top, 5)
                  }
                  .sheet(isPresented: $showingAdmin) {
                      AdminView()
                          .environmentObject(game)
                  }
                  .overlay(alignment: .topTrailing) {
