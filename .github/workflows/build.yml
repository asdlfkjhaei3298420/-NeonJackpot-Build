                              )
                              .font(.headline.bold())
                              .frame(maxWidth: .infinity)
                              .padding()
                              .foregroundStyle(.black)
                              .background(
                                  .green,
                                  in: RoundedRectangle(cornerRadius: 15)
                              )
                          }
                          .buttonStyle(.plain)

                          Button(role: .destructive) {
                              showingResetConfirmation = true
                          } label: {
                              Label(
                                  "Reset All Game Data",
                                  systemImage: "trash.fill"
                              )
                              .font(.headline.bold())
                              .frame(maxWidth: .infinity)
                              .padding()
                              .background(
                                  .red.opacity(0.2),
                                  in: RoundedRectangle(cornerRadius: 15)
                              )
                          }
                          .buttonStyle(.plain)

                          Text(
                              "Simulated credits only. No purchases, deposits, withdrawals, prizes, or real-money wagering."
                          )
                          .font(.caption)
                          .foregroundStyle(.white.opacity(0.55))
                          .multilineTextAlignment(.center)
                      }
                      .padding(22)
