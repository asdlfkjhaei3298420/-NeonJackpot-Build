              private var controls: some View {
                  ScrollView {
                      VStack(spacing: 18) {
                          Image(systemName: "gearshape.2.fill")
                              .font(.system(size: 50))
                              .foregroundStyle(.cyan)

                          Text("CASINO ADMINISTRATION")
                              .font(.headline.weight(.black))

                          Toggle(isOn: $game.developerMode) {
                              VStack(alignment: .leading, spacing: 3) {
                                  Text("Developer Mode")
                                      .font(.headline.bold())

