              private func shortChip(_ amount: Int) -> String {
                  if amount >= 1_000 {
                      return "\(amount / 1_000)K"
                  }

                  return "\(amount)"
              }
          }

          struct AnimatedRouletteWheel: View {
              let targetNumber: Int

              @State private var wheelRotation = 0.0
              @State private var ballRotation = 0.0

              var body: some View {
                  GeometryReader { geometry in
                      let size = min(geometry.size.width, geometry.size.height)
                      let center = CGPoint(x: size / 2, y: size / 2)
                      let radius = size * 0.42
                      let labelRadius = size * 0.37
                      let step = 360.0 / Double(EuropeanRoulette.order.count)

                      ZStack {
                          Circle()
                              .fill(
                                  RadialGradient(
                                      colors: [
                                          Color(red: 0.58, green: 0.3, blue: 0.08),
                                          Color(red: 0.2, green: 0.06, blue: 0.01)
                                      ],
                                      center: .center,
                                      startRadius: 10,
                                      endRadius: radius
                                  )
                              )
                              .overlay {
                                  Circle()
                                      .stroke(.yellow, lineWidth: 5)
                              }

                          ZStack {
                              ForEach(
                                  Array(EuropeanRoulette.order.enumerated()),
                                  id: \.offset
                              ) { index, number in
                                  let angle = Double(index) * step

                                  RoulettePocket(number: number)
                                      .frame(width: size * 0.075, height: size * 0.075)
                                      .rotationEffect(.degrees(-wheelRotation - angle))
                                      .position(
                                          x: center.x + labelRadius * CGFloat(
                                              sin(angle * .pi / 180)
                                          ),
                                          y: center.y - labelRadius * CGFloat(
                                              cos(angle * .pi / 180)
                                          )
                                      )
                              }
                          }
                          .rotationEffect(.degrees(wheelRotation))

                          Circle()
                              .fill(.black)
                              .frame(width: size * 0.34, height: size * 0.34)
                              .overlay {
                                  VStack(spacing: 2) {
                                      Text("SPIN")
                                          .font(.system(size: size * 0.11, weight: .black))
                                      Text("ROULETTE")
                                          .font(.caption2.bold())
                                          .foregroundStyle(.white.opacity(0.55))
                                  }
                              }

                          Circle()
                              .fill(.white)
                              .frame(width: size * 0.045, height: size * 0.045)
                              .shadow(color: .black, radius: 3)
                              .offset(y: -radius * 0.76)
                              .rotationEffect(.degrees(ballRotation))
                      }
                      .frame(width: size, height: size)
                      .onAppear {
                          let targetIndex =
                              EuropeanRoulette.order.firstIndex(of: targetNumber) ?? 0
                          let targetAngle = Double(targetIndex) * step

                          wheelRotation = 0
                          ballRotation = 0

                          DispatchQueue.main.async {
                              withAnimation(.easeOut(duration: 3.15)) {
                                  wheelRotation = 1_800 - targetAngle
                                  ballRotation = -1_440 + targetAngle
                              }
                          }
                      }
                  }
              }
          }

