              private func outsideBetRow(
                  width: CGFloat,
                  y: CGFloat,
                  height: CGFloat
              ) -> some View {
                  let topHeight = height / 2
                  let third = width / 3

                  let low = RouletteBetSpot.outside(
                      id: "LOW",
                      label: "1-18",
                      numbers: Array(1...18)
                  )

                  let high = RouletteBetSpot.outside(
                      id: "HIGH",
                      label: "19-36",
                      numbers: Array(19...36)
                  )

                  let even = RouletteBetSpot.outside(
                      id: "EVEN",
                      label: "EVEN",
                      numbers: Array(1...36).filter { $0.isMultiple(of: 2) }
                  )

                  let odd = RouletteBetSpot.outside(
                      id: "ODD",
                      label: "ODD",
                      numbers: Array(1...36).filter { !$0.isMultiple(of: 2) }
                  )

                  let red = RouletteBetSpot.outside(
                      id: "RED",
                      label: "RED",
                      numbers: Array(EuropeanRoulette.redNumbers)
                  )

                  let black = RouletteBetSpot.outside(
                      id: "BLACK",
                      label: "BLACK",
                      numbers: Array(1...36).filter {
                          !EuropeanRoulette.redNumbers.contains($0)
                      }
                  )

                  return ZStack(alignment: .topLeading) {
                      outsideCell(low, fill: .green.opacity(0.45))
                          .frame(width: third, height: topHeight)
                          .position(x: third / 2, y: y + topHeight / 2)

                      outsideCell(even, fill: .green.opacity(0.45))
                          .frame(width: third, height: topHeight)
                          .position(x: third + third / 2, y: y + topHeight / 2)

                      outsideCell(red, fill: .red)
                          .frame(width: third, height: topHeight)
                          .position(x: third * 2 + third / 2, y: y + topHeight / 2)

                      outsideCell(black, fill: .black)
                          .frame(width: third, height: topHeight)
                          .position(x: third / 2, y: y + topHeight + topHeight / 2)

                      outsideCell(odd, fill: .green.opacity(0.45))
                          .frame(width: third, height: topHeight)
                          .position(x: third + third / 2, y: y + topHeight + topHeight / 2)

                      outsideCell(high, fill: .green.opacity(0.45))
                          .frame(width: third, height: topHeight)
                          .position(x: third * 2 + third / 2, y: y + topHeight + topHeight / 2)
                  }
              }

              private func outsideCell(
                  _ spot: RouletteBetSpot,
                  fill: Color
              ) -> some View {
                  let amount = game.rouletteBets[spot.id] ?? 0

                  return ZStack {
                      Rectangle()
                          .fill(fill)
