                          chip: game.rouletteSelectedChip
                      )
                  }
                  .dropDestination(for: String.self) { items, _ in
                      guard
                          let raw = items.first,
                          let chip = Int(raw)
                      else {
                          return false
                      }

                      game.addRouletteBet(spot, chip: chip)
                      return true
